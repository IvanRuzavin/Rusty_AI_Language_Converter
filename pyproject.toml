[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rusty-ai-language-converter"
version = "0.1.0"
description = "Convert MikroE Click packages from C to Rust."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Ivan Ruzavin" },
]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-c==0.24.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rusty_ai_converter = ["py.typed"]
